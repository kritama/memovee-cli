name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Go validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.25.x
          cache: true

      - name: Verify formatting
        run: |
          gofmt -l . | tee /tmp/memovee-cli-unformatted-files
          test ! -s /tmp/memovee-cli-unformatted-files

      - name: Run unit tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Build CLI
        run: go build -trimpath -o /tmp/memovee ./cmd/memovee
